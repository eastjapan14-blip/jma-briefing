name: jma-watch
on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごと（GitHub の混雑時は遅れることがある）
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 候補を検知して ntfy に通知
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/notify.py
